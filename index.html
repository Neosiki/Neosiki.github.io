<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>AI·AX 업무 전환 서비스</title>
</head>
<body>
<script>
(async function () {
  const src = 'https://raw.githubusercontent.com/Neosiki/Neosiki.github.io/407b13537c522b82949332b4d74b72afe1559f45/index.html';
  const res = await fetch(src);
  let html = await res.text();
  html = html.replace('assets/projects.js?v=013d0b1', 'assets/projects.js?v=013d0b2');
  if (!html.includes('archive-images-fix.js')) {
    html = html.replace('</body>', '<script src="assets/archive-images-fix.js?v=2"><\/script></body>');
  }
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
